<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }

    .board {
      height: 100vh;
      background-image: url("../../aj.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box");
      var board = jQuery(".board");
      var boardWidth = board.width();
      var boardHeight = jQuery(window).height();

      jQuery(window).on("resize", function () {
        boardWidth = board.width();
        boardHeight = jQuery(window).height();
      });

      var interval = setInterval(update, 50);

      box.on("click", handleBoxClick);
      board.on("click", handleBoardClick);

      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      function changeBoxText(newText) {
        box.text(newText);
      }

      function getRandomColor() {
        var red = Math.floor(Math.random() * 256);
        var green = Math.floor(Math.random() * 256);
        var blue = Math.floor(Math.random() * 256);
        return "rgb(" + red + ", " + green + ", " + blue + ")";
      }

      function endGame() {
        clearInterval(interval);
        box.text("Game Over");
        box.css("background-color", "red");
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      var positionX = 0;
      var positionY = 100;
      var points = 0;
      var speed = 10;
      var speedY = 5;
      var misClicks = 2;

      function update() {
        positionX += speed;
        positionY += speedY;

        if (positionX > boardWidth) {
          positionX = boardWidth;
          speed *= -1;
        }

        if (positionX < 0) {
          positionX = 0;
          speed *= -1;
        }

        if (positionY > boardHeight - 70) {
          positionY = boardHeight - 70;
          speedY *= -1;
        }

        if (positionY < 0) {
          positionY = 0;
          speedY *= -1;
        }

        moveBoxTo(positionX, positionY);
      }

      function handleBoxClick(event) {
        event.stopPropagation();

        positionX = Math.random() * Math.max(0, boardWidth - box.width());
        positionY = Math.random() * Math.max(0, boardHeight - box.height() - 30);
        points++;
        speed = 3 * points + 10;

        if (points % 3 === 0) {
          speed += 3;
        }

        changeBoxText(points);
        box.css("background-color", getRandomColor());
        moveBoxTo(positionX, positionY);
      }

      function handleBoardClick() {
        misClicks++;

        if (misClicks >= 10) {
          endGame();
        }
      }
    })();
  </script>
</body>

</html>
